services: 
  config-server:
    image: petclinic-config-server:dev
    container_name: config-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports: 
      - 8888:8888

  discovery-server:
    image: petclinic-discovery-server:dev
    container_name: discovery-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://discovery-server:8761"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports: 
      - 8761:8761
    depends_on: 
      config-server:
        condition: service_healthy
    
  customers-service:
    image: petclinic-customers-service:dev
    container_name: customers-service
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 8081:8081
    depends_on: 
     config-server:
       condition: service_healthy
     discovery-server:
       condition: service_healthy
    
  visits-service:
    image: petclinic-visits-service:dev
    container_name: visits-service
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 8082:8082
    depends_on: 
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  vets-service:
    image: petclinic-vets-service:dev
    container_name: vets-service
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 8083:8083
    depends_on: 
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
  
  api-gateway:
    image: petclinic-api-gateway:dev
    container_name: api-gateway
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 8080:8080
    depends_on: 
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      
  admin-server:
    image: petclinic-admin-server:dev
    container_name: admin-server
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 9090:9090
    depends_on: 
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  hystrix-dashboard:
    image: petclinic-hystrix-dashboard:dev
    container_name: hystrix-dashboard
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 7979:7979
    depends_on: 
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
        
  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 9411:9411 
  
  grafana-server:
    image: petclinic-grafana-server:dev
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 3000:3000

  prometheus-server:
    image: petclinic-prometheus-server:dev
    container_name: prometheus-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 9091:9090

  mysql-server:
    image: mysql:5.7.8
    container_name: mysql-server
    environment: 
      MYSQL_ROOT_PASSWORD: petclinic
      MYSQL_DATABASE: petclinic
    mem_limit: 256M
    ports:
    - 3306:3306